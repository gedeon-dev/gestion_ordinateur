name: GestionOrdinateurs CI and Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Build and test solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GestionOrdinateurs.slnx

      - name: Build solution
        run: dotnet build GestionOrdinateurs.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: tests
    environment: dev
    env:
      DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Validate Docker Hub account
        run: test -n "$DOCKER_ACCOUNT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application images with Compose
        run: >-
          docker compose -f compose.yaml build
          authentificationapi
          gestionordinateurs-api
          gestionordinateurs-client
          gestionordinateurs-gateway

      - name: Push application images with Compose
        run: >-
          docker compose -f compose.yaml push
          authentificationapi
          gestionordinateurs-api
          gestionordinateurs-client
          gestionordinateurs-gateway
