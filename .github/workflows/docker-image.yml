name: GestionOrdinateurs CI and Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Build and test solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GestionOrdinateurs.slnx

      - name: Build solution
        run: dotnet build GestionOrdinateurs.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: AuthentificationApi
            image: authentificationapi
          - project: GestionOrdinateurs.API
            image: gestionordinateurs-api
          - project: GestionOrdinateurs.Client
            image: gestionordinateurs-client
          - project: GestionOrdinateurs.Gateway
            image: gestionordinateurs-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_ACCOUNT }}/${{ matrix.image }}:latest
