services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - appnet

  authentificationapi:
    image: ${DOCKER_ACCOUNT:-local}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      UsersApi__BaseAddress: http://gestionordinateurs-api:5015/
      Cors__AllowedOrigins__0: http://localhost:5000
    ports:
      - "5273:5273"
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins__0: http://localhost:5000
    ports:
      - "5015:5015"
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__AllowedOrigins__0: http://localhost:5000
      ReverseProxy__Clusters__gestionOrdinateurs__Destinations__api__Address: http://gestionordinateurs-api:5015/
    ports:
      - "5010:5010"
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AuthenticationApi__BaseAddress: http://authentificationapi:5273/
      ManagementApi__BaseAddress: http://gestionordinateurs-gateway:5010/
    ports:
      - "5000:5000"
    depends_on:
      - authentificationapi
      - gestionordinateurs-gateway
    networks:
      - appnet

  gestionordinateurs-tests:
    image: ${DOCKER_ACCOUNT:-local}/gestionordinateurs-tests:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Tests/Dockerfile
    profiles:
      - tests
    networks:
      - appnet

volumes:
  postgres_data:
  keycloak_data:

networks:
  appnet:
    driver: bridge
